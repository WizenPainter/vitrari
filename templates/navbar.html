<header style="background-color:#1976d2; color:#ffffff; padding:1rem 1.5rem; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); position:sticky; top:0; z-index:1010;">
    <div style="display:flex; align-items:center; justify-content:space-between;">
        <div style="display:flex; align-items:center;">
            <h1 style="font-size:1.25rem; font-weight:700; margin:0;">
                <a href="/" style="color:#ffffff; text-decoration:none; display:flex; align-items:center;">
                    <img src="/static/assets/logo.png" alt="Vitrari Logo" width="32" height="32" style="display:inline-block; margin-right:0.5rem; vertical-align:middle;">
                    Vitrari
                </a>
            </h1>
        </div>

        <nav style="display:flex; align-items:center; gap:1.5rem;">
            <ul style="display:flex; gap:1.5rem; list-style:none; margin:0; padding:0; align-items:center;">
                <li>
                    <a href="/" style="display:inline-flex; align-items:center; color:#ffffff; text-decoration:none; padding:0.5rem 1rem; border-radius:0.375rem; transition:background-color 150ms ease-in-out; {{if eq .Page "home"}}background-color:rgba(255,255,255,0.2);{{end}}">
                        <svg width="16" height="16" fill="currentColor" style="display:inline; margin-right:0.25rem; vertical-align:middle;">
                            <path d="M8 1l7 7v7a1 1 0 01-1 1H2a1 1 0 01-1-1V8l7-7z"/>
                        </svg>
                        Home
                    </a>
                </li>
                <li>
                    <a href="/design" style="display:inline-flex; align-items:center; color:#ffffff; text-decoration:none; padding:0.5rem 1rem; border-radius:0.375rem; transition:background-color 150ms ease-in-out; {{if eq .Page "designer"}}background-color:rgba(255,255,255,0.2);{{end}}">
                        <svg width="16" height="16" fill="currentColor" style="display:inline; margin-right:0.25rem; vertical-align:middle;">
                            <rect x="2" y="2" width="12" height="12" rx="1"/>
                            <circle cx="6" cy="6" r="1"/>
                            <circle cx="10" cy="10" r="1"/>
                        </svg>
                        Designer
                    </a>
                </li>
                <li>
                    <a href="/optimize" style="display:inline-flex; align-items:center; color:#ffffff; text-decoration:none; padding:0.5rem 1rem; border-radius:0.375rem; transition:background-color 150ms ease-in-out; {{if eq .Page "optimizer"}}background-color:rgba(255,255,255,0.2);{{end}}">
                        <svg width="16" height="16" fill="currentColor" style="display:inline; margin-right:0.25rem; vertical-align:middle;">
                            <rect x="1" y="1" width="6" height="4"/>
                            <rect x="9" y="1" width="6" height="4"/>
                            <rect x="1" y="7" width="6" height="4"/>
                            <rect x="9" y="7" width="6" height="4"/>
                            <rect x="5" y="13" width="6" height="2"/>
                        </svg>
                        Optimizer
                    </a>
                </li>
                <li>
                    <a href="/orders" style="display:inline-flex; align-items:center; color:#ffffff; text-decoration:none; padding:0.5rem 1rem; border-radius:0.375rem; transition:background-color 150ms ease-in-out; {{if eq .Page "orders"}}background-color:rgba(255,255,255,0.2);{{end}}">
                        <svg width="16" height="16" fill="currentColor" style="display:inline; margin-right:0.25rem; vertical-align:middle;">
                            <rect x="4" y="8" width="12" height="8" rx="1" stroke="currentColor" stroke-width="1.5" fill="none"/>
                            <line x1="8" y1="12" x2="12" y2="12" stroke="currentColor" stroke-width="1.5"/>
                            <line x1="8" y1="14" x2="10" y2="14" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="14" cy="4" r="2" fill="currentColor"/>
                            <path d="M12 4h4M14 2v4" stroke="white" stroke-width="1"/>
                        </svg>
                        Pedidos
                    </a>
                </li>
            </ul>

            {{if .User}}
            <div style="position:relative; margin-left:1rem;">
                <button onclick="toggleUserMenu()" aria-expanded="false" aria-haspopup="true"
                        style="background:transparent; color:#ffffff; border:1px solid rgba(255,255,255,0.3); padding:0.5rem 0.75rem; border-radius:0.375rem; display:inline-flex; align-items:center; gap:0.5rem; cursor:pointer; font-size:0.875rem;">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="display:inline-block; vertical-align:middle;">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                    </svg>
                    <span style="display:inline-block; vertical-align:middle;">{{.User.FirstName}}</span>
                    <svg width="12" height="12" fill="currentColor" viewBox="0 0 16 16" style="display:inline-block; vertical-align:middle; margin-left:0.25rem;">
                        <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                    </svg>
                </button>
                <div id="userDropdownMenu"
                     style="position:absolute; top:calc(100% + 8px); right:0; background:#ffffff; color:#212121; border:1px solid #e0e0e0; border-radius:0.5rem; min-width:220px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.1); padding:0.5rem 0; display:none; z-index:1000;">
                    <div style="display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem;">
                        <div style="width:32px; height:32px; border-radius:50%; background:#f5f5f5; color:#757575; display:flex; align-items:center; justify-content:center;">
                            <svg width="24" height="24" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                            </svg>
                        </div>
                        <div style="display:flex; flex-direction:column;">
                            <div style="font-weight:600; font-size:0.95rem;">{{.User.FirstName}} {{.User.LastName}}</div>
                            <div style="font-size:0.875rem; color:#757575;">{{.User.Email}}</div>
                        </div>
                    </div>
                    <div style="height:1px; background:#e0e0e0; margin:0.5rem 0;"></div>
                    <a href="/profile" style="display:flex; align-items:center; gap:0.5rem; color:#212121; text-decoration:none; padding:0.625rem 1rem;">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"/>
                        </svg>
                        Profile
                    </a>
                    <a href="/settings" style="display:flex; align-items:center; gap:0.5rem; color:#212121; text-decoration:none; padding:0.625rem 1rem;">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z"/>
                            <path d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z"/>
                        </svg>
                        Account Settings
                    </a>
                    <div style="height:1px; background:#e0e0e0; margin:0.5rem 0;"></div>
                    <button onclick="handleLogout()" style="display:flex; align-items:center; gap:0.5rem; color:#f44336; background:transparent; border:0; padding:0.625rem 1rem; width:100%; text-align:left; cursor:pointer;">
                        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                            <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
            {{else}}
            <div style="margin-left:1rem;">
                <a href="/auth" style="display:inline-flex; align-items:center; gap:0.5rem; color:#ffffff; text-decoration:none; background:transparent; border:1px solid rgba(255,255,255,0.3); padding:0.5rem 0.75rem; border-radius:0.375rem; font-size:0.875rem;">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="display:inline-block; vertical-align:middle;">
                        <path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5 1 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0v-2z"/>
                        <path fill-rule="evenodd" d="M11.854 8.354a .5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                    </svg>
                    Login
                </a>
            </div>
            {{end}}
        </nav>
    </div>
</header>
